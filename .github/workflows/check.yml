name: Check VPN Servers

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run check script
        run: python3 check.py

      - name: Commit and push clean subscription
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add clean_sub.txt clean_sub_base64.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update clean proxies" && git push)
